services:
  #base:
  #  build:
  #    context: ./docker-debian
  #    dockerfile: Dockerfile
  #  image: tiredofit/debian:bookworm
  freepbx-app:
    container_name: freepbx-app
    build:
      context: .
      dockerfile: Dockerfile  
    ports:
      - '8088:8088'
      - '8089:8089'
      - '5038:5038'
      - '5060:5060/udp'
      - '5160:5160/udp'
      - '18000-18100:18000-18100/udp'
      - '4445:4445'
     #### Flash Operator Panel
      - 4445:4445
    volumes:
      - './certs:/certs'
      - './data:/data'
      - './logs:/var/log'
      - './data/www:/var/www/html'
      #- ./docker-freepbx/install/etc/cont-init.d/10-freepbx:/etc/cont-init.d/10-freepbx
      #- ./docker-debian/install/assets/functions/00-container:/assets/functions/00-container
     ### Only Enable this option below if you set DB_EMBEDDED=TRUE
      #  - ./db:/var/lib/mysql
     ### You can drop custom files overtop of the image if you have made modifications to modules/css/whatever - Use with care
      #- ./assets/custom:/assets/custom

    environment:
      - VIRTUAL_HOST=freepbx.local.com
      - VIRTUAL_NETWORK=freepbx-net
     ### If you want to connect to the SSL Enabled Container 
     #- VIRTUAL_PORT=443
     #- VIRTUAL_PROTO=https
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=freepbx.local.com
      - LETSENCRYPT_EMAIL=email@example.com
      #- DEBUG_MODE=true
      - ZABBIX_HOSTNAME=freepbx-app

      - RTP_START=18000
      - RTP_FINISH=18100
    
     ## Use for External MySQL Server
      - DB_EMBEDDED=FALSE

     ### These are only necessary if DB_EMBEDDED=FALSE
      - DB_HOST=freepbx-db
      - DB_PORT=3306
      - DB_NAME=asterisk
      - DB_USER=asterisk
      - DB_PASS=asteriskpass
      - FREEPBX_VERSION=17.0-latest-EDGE
    
     ### If you are using TLS Support for Apache to listen on 443 in the container drop them in /certs and set these:
      #  - TLS_CERT=cert.pem
      #  - TLS_KEY=key.pem
    command: ["tail", "-f", "/dev/null"] 
    restart: always
    networks:
      - freepbx-net

    ### These final lines are for Fail2ban. If you don't want, comment and also add ENABLE_FAIL2BAN=FALSE to your environment
    cap_add:
      - NET_ADMIN
    privileged: true

  freepbx-db:
    container_name: freepbx-db
    image: tiredofit/mariadb:11.4-latest
    restart: always
    volumes:
      - './db:/var/lib/mysql'
      - freepbx-db:/var/lib/postgresql/data
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=asterisk
      - MYSQL_USER=asterisk
      - MYSQL_PASSWORD=asteriskpass
    networks:
      - freepbx-net
networks:
  freepbx-net:
    external: true

volumes:
  freepbx-db:
